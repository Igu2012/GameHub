<!DOCTYPE html>
<html lang="en-us">
<head>
    <script>
        (function() {
            function enableFullscreen() {
                const docEl = document.documentElement;
                const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
                if (requestFullScreen) {
                    requestFullScreen.call(docEl).catch(e => {});
                }
            }
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                ['touchstart', 'click', 'keydown'].forEach(event => {
                    window.addEventListener(event, enableFullscreen, { once: true });
                });
            }
        })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bad Piggies</title>
    
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        body::before, body::after {
            display: none !important;
        }
        .webgl-content {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            transform: none !important;
        }
        #gameContainer {
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    

<script>
    (function() {
        function enableFullscreen() {
            const docEl = document.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFullScreen) {
                requestFullScreen.call(docEl).catch(e => {});
            }
        }

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            ['touchstart', 'click', 'keydown'].forEach(event => {
                window.addEventListener(event, enableFullscreen, { once: true });
            });
        }
    })();
</script>
</head>
<body>
    <div class="webgl-content">
        <div id="gameContainer"></div>
    </div>
    <script>
        window.addEventListener("load", function () {
            if (typeof UnityLoader === "undefined") {
                console.error("UnityLoader failed to load.");
                return;
            }

            window.gameInstance = UnityLoader.instantiate(
                "gameContainer",
                "Build/Bad Piggies.json",
                { onProgress: UnityProgress }
            );
        });
    </script>
</body>
</html>
