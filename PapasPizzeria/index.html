<!DOCTYPE html>
<html>
<head>
    <script>
    (function() {
        function enableFullscreen() {
            const docEl = document.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFullScreen) {
                requestFullScreen.call(docEl).catch(e => {});
            }
        }

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            ['touchstart', 'click', 'keydown'].forEach(event => {
                window.addEventListener(event, enableFullscreen, { once: true });
            });
        }
    })();
</script>
    <link rel="icon" type="image/png" href="../img/papaspizzeria.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Papa's Pizzeria</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100%; height: 100%; }
    </style>
    <script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { ...(window.RufflePlayer.config || {}), contextMenu: "off" };
</script>

    <script src="ruffle.js"></script>

    


</head>
<body>

    <div id="player"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("player").appendChild(player);
            
            player.style.width = "100%";
            player.style.height = "100%";
            
            player.load("papaspizzeria.swf"); 
        });
    </script>

</body>
</html>
