<!doctype html>
<html>
<head>
    <script>
    (function() {
        function enableFullscreen() {
            const docEl = document.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFullScreen) {
                requestFullScreen.call(docEl).catch(e => {});
            }
        }

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            ['touchstart', 'click', 'keydown'].forEach(event => {
                window.addEventListener(event, enableFullscreen, { once: true });
            });
        }
    })();
</script>
    <link rel="icon" type="image/x-icon" href="/PvZ/favicon.ico">
    
    <title>Plants vs Zombies</title>
    <style>
        #loading-ui { 
            position: fixed; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; 
            width: 300px; 
            font-family: sans-serif;
            color: #fff;
            z-index: 10;
        }
        #bar-container { 
            width: 100%; 
            height: 6px; 
            background: #333; 
            margin-top: 10px; 
            border-radius: 3px; 
        }
        #bar-fill { 
            width: 0%; 
            height: 100%; 
            background: #eee; 
            border-radius: 3px; 
            transition: width 0.1s; 
        }
        #status-text { 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
    </style>
    


  <link rel="stylesheet" href="../gamehub-loading-theme.css">
</head>
<body style="margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden">
  <base href="https://cdn.jsdelivr.net/gh/web-ports/pvz@latest/">
  
  <div id="loading-ui" class="gamehub-loading" data-loading-style="garden" style="--gamehub-load-accent: #8fda51;">
      <div id="status-text">LOADING...</div>
      <div id="bar-container"><div id="bar-fill"></div></div>
  </div>
  
  <canvas id="canvas" width="800" height="600" style="display:block; outline:0"></canvas>

  <textarea
    id="pvz-soft-keyboard"
    style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none; font-size:16px"
    autocapitalize="off"
    autocomplete="off"
    autocorrect="off"
    enterkeyhint="done"
    spellcheck="false"
  ></textarea>

  <script>
    let _res, _rej;
    window.moduleReadyPromise = new Promise((r, e) => { _res = r; _rej = e; });

    var Module = {
      canvas: document.getElementById("canvas"),
      noInitialRun: true,
      onRuntimeInitialized: _res,
      onAbort: e => _rej(e),
      print: console.log,
      printErr: console.warn,
    };
  </script>

  <script>
    const statusText = document.querySelector("#status-text");
    const barFill = document.querySelector("#bar-fill");
    const loadingUI = document.querySelector("#loading-ui");
    
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '43.34';
        statusText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
        barFill.style.width = `${(loadedBytes / (43.34 * 1024 * 1024)) * 100}%`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const cache = await caches.open("pvz-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        return URL.createObjectURL(blob);
      }
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }

    (async () => {
      const [pakurl] = await Promise.all([
        mergeFiles(getParts("main.pak", 1, 3), "main.pak"),
      ]);
      let ns = document.createElement("script");
      ns.src="pvz.js";
      document.body.appendChild(ns);
      await moduleReadyPromise;

      const files = [
        [pakurl, "main.pak"],
        ["properties/Layout.xml", "properties/Layout.xml"],
        ["properties/partner.xml.sig", "properties/partner.xml.sig"],
        ["properties/default.xml", "properties/default.xml"],
        ["properties/partner.xml", "properties/partner.xml"],
        ["properties/partner_logo.jpg", "properties/partner_logo.jpg"],
      ];

      for (const [src, dest] of files) {
        const data = new Uint8Array(await (await fetch(src)).arrayBuffer());
        const parts = dest.split("/");
        let dir = "/";
        for (let i = 0; i < parts.length - 1; i++) {
          dir += (dir === "/" ? "" : "/") + parts[i];
          try { Module.FS.mkdir(dir); } catch {}
        }
        Module.FS.writeFile("/" + dest, data);
      }

      try { Module.FS.mkdir("/saves"); } catch {}
      try { Module.FS.mount(Module.FS.filesystems.IDBFS, {}, "/saves"); } catch {}
      await new Promise(r => Module.FS.syncfs(true, r));

      const c = document.getElementById("canvas");
      const resize = () => {
        const s = Math.min(innerWidth / 800, innerHeight / 600);
        c.style.width  = s * 800 + "px";
        c.style.height = s * 600 + "px";
      };
      resize();
      addEventListener("resize", resize);
      addEventListener("fullscreenchange", resize);

      const sync = () => Module.FS.syncfs(false, () => {});
      setInterval(sync, 5000);
      addEventListener("visibilitychange", () => document.hidden && sync());
      addEventListener("pagehide", sync);

      Module.callMain([]);
      loadingUI.remove();
    })();
  </script>
</body>
</html>
