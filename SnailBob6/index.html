<style>
  #orientation {
    width: 100%; height: 100%; display: none; position: fixed; inset: 0;
    z-index: 2147483647; background-color: #000;
  }
  #orientation p {
    font: 40px Arial, sans-serif; color: #fff; text-align: center; width: 80%;
    position: fixed; top: 50%; margin: 0; transform: translate(15%, -50%);
  }
  @media (max-width: 767px) { #orientation p { font-size: 30px; } }
</style>

<script>
(() => {
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (!isMobile) return;
  const enterFullscreen = () => {
    const root = document.documentElement;
    const request = root.requestFullscreen || root.mozRequestFullScreen || root.webkitRequestFullScreen || root.msRequestFullscreen;
    if (request && !document.fullscreenElement && !document.webkitFullscreenElement) {
      Promise.resolve(request.call(root)).catch(() => {});
    }
  };
  const updateOrientation = () => {
    const notice = document.getElementById('orientation');
    if (notice) notice.style.display = window.matchMedia('(orientation: portrait)').matches ? 'block' : 'none';
  };
  ['touchstart', 'click', 'keydown'].forEach((eventName) => window.addEventListener(eventName, enterFullscreen, { once: true }));
  window.addEventListener('orientationchange', updateOrientation);
  window.addEventListener('resize', updateOrientation);
  document.addEventListener('DOMContentLoaded', updateOrientation);
})();
</script>

        function addScript(src, buster, callback) {
            var s = document.createElement('script');
            s.setAttribute('src', src + '?v=' + buster);
            if (typeof callback === 'function') {
                s.onload = callback;
            }
            document.body.appendChild(s);
        }


        addScript('version.js', Date.now(), function() {
