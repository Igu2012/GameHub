<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no, shrink-to-fit=yes">
  <meta name="theme-color" content="#06111a">
  <meta name="description" content="Play Celeste online on GameHub.">
  <title>Celeste</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="prefetch" id="mountainsrc" href="assets/mountain.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../gamehub-loading-theme.css">
  <style>
    html, body { background: #000; }
    #loading-textt { position: fixed; inset: 0; z-index: 99999; text-align: center; pointer-events: none; }
  </style>
  <script>
    (() => {
      const isMobile = /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent);
      if (!isMobile) return;
      const enableFullscreen = () => {
        const root = document.documentElement;
        const request = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
        if (request && !document.fullscreenElement && !document.webkitFullscreenElement) Promise.resolve(request.call(root)).catch(() => {});
      };
      ['touchstart', 'click', 'keydown'].forEach(eventName => window.addEventListener(eventName, enableFullscreen, { once: true, passive: eventName === 'touchstart' }));
    })();
  </script>
  <script src="cfg.js"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="loading-textt" class="gamehub-loading" data-loading-style="sky" style="--gamehub-load-accent: #6dbee7;" role="status" aria-live="polite">
    <div id="status-text">Preparing game files</div>
    <div id="bar-container" aria-hidden="true"><div id="bar-fill"></div></div>
    <div id="progress-detail">0.00 MB / 681.43 MB</div>
    <div id="error-box"></div>
  </div>
  <!-- Local web port source: https://github.com/web-ports/celeste -->
  <script>
    (() => {
      const totalBytes = 714532328;
      let loadedBytes = 0;
      const status = document.getElementById('status-text');
      const bar = document.getElementById('bar-fill');
      const detail = document.getElementById('progress-detail');
      const overlay = document.getElementById('loading-textt');
      const formatMB = bytes => `${(bytes / 1048576).toFixed(2)} MB`;
      const render = (message, suffix = '') => {
        const complete = Math.min(loadedBytes, totalBytes);
        status.textContent = message;
        detail.textContent = suffix || `${formatMB(complete)} / ${formatMB(totalBytes)}`;
        bar.style.width = `${Math.min(100, complete / totalBytes * 100)}%`;
      };
      window.gamehubLoading = {
        addNative(bytes) { loadedBytes += bytes; render('Preparing game runtime'); },
        addData(bytes, index, total) { loadedBytes += bytes; render(`Downloading game files (${index}/${total})`); },
        setStage(message) { render(message); },
        complete() { loadedBytes = totalBytes; render('Ready'); setTimeout(() => { overlay.style.display = 'none'; }, 250); },
        error(message) { status.textContent = 'Could not start Celeste'; document.getElementById('error-box').textContent = message || 'Refresh the page to try again.'; document.getElementById('error-box').style.display = 'block'; }
      };
      render('Preparing game files');
      window.addEventListener('error', () => window.gamehubLoading.error(), { once: true });
      window.addEventListener('unhandledrejection', () => window.gamehubLoading.error(), { once: true });
    })();
  </script>
  <script type="module" src="bundle.js"></script>
</body>
</html>
