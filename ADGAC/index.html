<!DOCTYPE html>
<html lang="en-us">
<head>
    <script>
    (function() {
        function enableFullscreen() {
            const docEl = document.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFullScreen) {
                requestFullScreen.call(docEl).catch(e => {});
            }
        }

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            ['touchstart', 'click', 'keydown'].forEach(event => {
                window.addEventListener(event, enableFullscreen, { once: true });
            });
        }
    })();
</script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A Difficult Game About Climbing</title>
    
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #111;
            color: #fff;
            font-family: sans-serif;
        }
        #unity-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
        }
        #loading-ui {
            position: absolute;
            text-align: center;
            width: 300px;
        }
        #bar-container {
            width: 100%;
            height: 6px;
            background: #333;
            margin-top: 10px;
            border-radius: 3px;
        }
        #bar-fill {
            width: 0%;
            height: 100%;
            background: #eee;
            border-radius: 3px;
            transition: width 0.1s;
        }
        #status-text {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
    


  <link rel="stylesheet" href="../gamehub-loading-theme.css">
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <div id="loading-ui" class="gamehub-loading" data-loading-style="arcade" style="--gamehub-load-accent: #ff4b4b;">
            <div id="status-text">loading data</div>
            <div id="bar-container"><div id="bar-fill"></div></div>
        </div>
    </div>
    <script>
        var loadingText = document.querySelector("#loading-text");
        let totalBytes = 0;
        let loadedBytes = 0;

        async function fetchWithProgress(url) {
            const response = await fetch(url);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                loadedBytes += value.length;
                chunks.push(value);
                let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
                let mbTotal = '319.89';
                statusText.textContent = `loading... ${mbDone} MB / ${mbTotal} MB`;
            }
            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }
        async function mergeFiles(fileParts, cacheKey) {
            const buffers = await Promise.all(
                fileParts.map(part => fetchWithProgress(part))
            );
            const mergedBlob = new Blob(buffers);
            return URL.createObjectURL(mergedBlob);
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        const canvas = document.querySelector("#unity-canvas");
        const statusText = document.querySelector("#status-text");
        const barFill = document.querySelector("#bar-fill");
        const loadingUI = document.querySelector("#loading-ui");

        (async () => {
            const [dataUrl, wasmUrl] = await Promise.all([
                mergeFiles(getParts("Build/adgac.data", 1, 14), "gtagwebR2.data"),
                mergeFiles(getParts("Build/adgac.wasm", 1, 3), "gtagwebR2.wasm"),
            ]);
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/adgac.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: "Build/adgac.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Pontypants",
                productName: "A Difficult Game About Climbing",
                productVersion: "1.2.61",
            };
            var container = document.querySelector("#unity-container");
            container.hidden = false;
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                config.devicePixelRatio = 1;
            } else {
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    barFill.style.width = (100 * progress) + "%";
                    statusText.textContent = "loading";
                }).then((unityInstance) => {
                    loadingUI.style.display = "none";
                }).catch(async (message) => {
                    alert(message);
                });
            };
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
