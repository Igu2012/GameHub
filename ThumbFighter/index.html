<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="generator" content="Scirra Construct">
  <meta name="description" content="Thumb Fighter — jogo de luta para dois jogadores">
  <title>Thumb Fighter</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    #canvas, canvas {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    #rotate-device {
      display: none;
      position: fixed;
      z-index: 2147483647;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      padding: 24px;
      background: #000;
      color: #fff;
      font: 700 18px/1.3 Arial, sans-serif;
      text-align: center;
    }

    #rotate-device svg { width: 76px; height: 76px; fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    #rotate-device p { margin: 0; max-width: 270px; }

    @media (max-width: 900px) and (orientation: portrait) {
      #rotate-device.is-visible { display: flex; }
    }
  </style>
  <script>
    (() => {
      const isMobile = /iPhone|iPad|iPod|Android|Mobile|Tablet/i.test(navigator.userAgent);
      if (!isMobile) return;

      const enterMobileFullscreen = () => {
        const root = document.documentElement;
        const request = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
        if (request && !document.fullscreenElement && !document.webkitFullscreenElement) {
          Promise.resolve(request.call(root)).catch(() => {});
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      };

      ['touchstart', 'pointerdown', 'keydown'].forEach((eventName) => {
        window.addEventListener(eventName, enterMobileFullscreen, { once: true, passive: eventName !== 'keydown' });
      });
    })();
  </script>
</head>
<body>
  <div id="rotate-device" aria-live="polite" aria-label="Gire o dispositivo para jogar">
    <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="26" y="15" width="48" height="70" rx="6"></rect><path d="M19 32a38 38 0 0 1 56-14"></path><path d="m69 10 8 9-12 3"></path><path d="M81 68a38 38 0 0 1-56 14"></path><path d="m31 90-8-9 12-3"></path></svg>
    <p>Gire o celular para jogar</p>
  </div>
  <script>
    if (location.protocol.substr(0, 4) === 'file') {
      alert('O jogo precisa ser aberto por um servidor web.');
    }

    (() => {
      const isMobile = /iPhone|iPad|iPod|Android|Mobile|Tablet/i.test(navigator.userAgent);
      const rotateNotice = document.getElementById('rotate-device');
      const updateOrientationNotice = () => {
        const portrait = window.matchMedia('(orientation: portrait)').matches;
        rotateNotice.classList.toggle('is-visible', isMobile && portrait);
      };
      window.addEventListener('resize', updateOrientationNotice);
      window.addEventListener('orientationchange', updateOrientationNotice);
      updateOrientationNotice();
    })();
  </script>
  <script src="gameanalytics.js"></script>
  <noscript>
    <div id="notSupportedWrap">
      <h2 id="notSupportedTitle">Este jogo precisa de JavaScript</h2>
      <p class="notSupportedMessage">Ative o JavaScript para jogar Thumb Fighter.</p>
    </div>
  </noscript>
  <script src="scripts/supportcheck.js"></script>
  <script src="scripts/offlineclient.js" type="module"></script>
  <script src="scripts/main.js" type="module"></script>
  <script src="scripts/register-sw.js" type="module"></script>
</body>
</html>
