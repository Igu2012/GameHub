<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="generator" content="Scirra Construct">
  <meta name="description" content="Thumb Fighter — jogo de luta para dois jogadores">
  <title>Thumb Fighter</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    #canvas, canvas {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    #orientation {
      width: 100%;
      height: 100%;
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background-color: #000;
    }

    #orientation p {
      font: 40px Arial, sans-serif;
      color: #fff;
      text-align: center;
      width: 80%;
      position: fixed;
      top: 50%;
      margin: 0;
      transform: translate(15%, -50%);
    }

    @media (max-width: 767px) {
      #orientation p { font-size: 30px; }
    }
  </style>
  <script>
    (() => {
      const isMobile = /iPhone|iPad|iPod|Android|Mobile|Tablet/i.test(navigator.userAgent);
      if (!isMobile) return;

      const enterMobileFullscreen = () => {
        const root = document.documentElement;
        const request = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
        if (request && !document.fullscreenElement && !document.webkitFullscreenElement) {
          Promise.resolve(request.call(root)).catch(() => {});
        }
      };

      ['touchstart', 'click', 'keydown'].forEach((eventName) => {
        window.addEventListener(eventName, enterMobileFullscreen, { once: true });
      });
    })();
  </script>
</head>
<body>
  <div id="orientation" class="orientation-msg-container" data-orientation="landscape" aria-live="polite">
    <p class="orientation-msg-text">GIRE O DISPOSITIVO</p>
  </div>
  <script>
    if (location.protocol.substr(0, 4) === 'file') {
      alert('O jogo precisa ser aberto por um servidor web.');
    }

    (() => {
      const isMobile = /iPhone|iPad|iPod|Android|Mobile|Tablet/i.test(navigator.userAgent);
      const orientationNotice = document.getElementById('orientation');
      const updateOrientationNotice = () => {
        if (!isMobile) {
          orientationNotice.style.display = 'none';
          return;
        }
        orientationNotice.style.display = window.matchMedia('(orientation: portrait)').matches ? 'block' : 'none';
      };
      window.addEventListener('resize', updateOrientationNotice);
      window.addEventListener('orientationchange', updateOrientationNotice);
      updateOrientationNotice();
    })();
  </script>
  <script src="gameanalytics.js"></script>
  <noscript>
    <div id="notSupportedWrap">
      <h2 id="notSupportedTitle">Este jogo precisa de JavaScript</h2>
      <p class="notSupportedMessage">Ative o JavaScript para jogar Thumb Fighter.</p>
    </div>
  </noscript>
  <script src="scripts/supportcheck.js"></script>
  <script src="scripts/offlineclient.js" type="module"></script>
  <script src="scripts/main.js" type="module"></script>
  <script src="scripts/register-sw.js" type="module"></script>
</body>
</html>
