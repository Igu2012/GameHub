<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Buckshot Roulette</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script>
(function () {
  const isMobile = /iPhone|iPad|iPod|Android|Mobile|Tablet/i.test(navigator.userAgent);
  if (!isMobile) return;
  function enableFullscreen() {
    const root = document.documentElement;
    const request = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
    if (request && !document.fullscreenElement && !document.webkitFullscreenElement) {
      request.call(root).catch(() => {});
    }
  }
  ['touchstart', 'click', 'keydown'].forEach((eventName) => {
    window.addEventListener(eventName, enableFullscreen, { once: true, passive: eventName === 'touchstart' });
  });
})();
</script>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: Arial, sans-serif; }
#game-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
#loading-ui { position: absolute; z-index: 10; width: min(320px, 72vw); text-align: center; pointer-events: none; }
#status-text { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #f4f4f4; }
#bar-container { width: 100%; height: 6px; margin-top: 12px; overflow: hidden; border-radius: 4px; background: #343434; }
#bar-fill { width: 0%; height: 100%; border-radius: 4px; background: #ededed; transition: width 0.12s linear; }
#error-box { display: none; margin-top: 14px; color: #ff8d8d; font-size: 12px; line-height: 1.4; }
</style>
  <link rel="stylesheet" href="../gamehub-loading-theme.css">
</head>
<body>
  <div id="game-container">
    <canvas id="canvas">Your browser does not support the canvas tag.</canvas>
    <div id="loading-ui" class="gamehub-loading" data-loading-style="rust" style="--gamehub-load-accent: #ef6a4a;"><div id="status-text">loading data</div><div id="bar-container"><div id="bar-fill"></div></div><div id="error-box"></div></div>
  </div>
  <script src="buckshot-roulette.js"></script>
  <script>
  const canvas = document.querySelector('#canvas');
  const loadingUI = document.querySelector('#loading-ui');
  const statusText = document.querySelector('#status-text');
  const barFill = document.querySelector('#bar-fill');
  const errorBox = document.querySelector('#error-box');
  let loadedBytes = 0;
  // Soma fixa de todos os arquivos .pck e .wasm divididos do jogo.
  const expectedBytes = 388150053;
  function formatMB(bytes) { return (bytes / (1024 * 1024)).toFixed(2); }
  function update() {
    const percent = expectedBytes ? Math.min(100, 100 * loadedBytes / expectedBytes) : 0;
    barFill.style.width = percent + '%';
    statusText.textContent = expectedBytes ? `loading... ${formatMB(loadedBytes)} MB / ${formatMB(expectedBytes)} MB` : `loading... ${formatMB(loadedBytes)} MB`;
  }
  async function fetchPart(url) {
    const response = await fetch(url);
    if (!response.ok || !response.body) throw new Error(`Unable to load ${url} (${response.status})`);
    update();
    const reader = response.body.getReader();
    const chunks = []; let received = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); received += value.byteLength; loadedBytes += value.byteLength; update();
    }
    const output = new Uint8Array(received); let offset = 0;
    for (const chunk of chunks) { output.set(chunk, offset); offset += chunk.byteLength; }
    return output.buffer;
  }
  function parts(file, count) { return Array.from({ length: count }, (_, i) => `${file}.part${i + 1}`); }
  async function merge(partsList) { return URL.createObjectURL(new Blob(await Promise.all(partsList.map(fetchPart)))); }
  function fail(error) { console.error(error); statusText.textContent = 'loading failed'; errorBox.textContent = error.message || String(error); errorBox.style.display = 'block'; }
  (async () => {
    try {
      const [pckUrl, wasmUrl] = await Promise.all([merge(parts('buckshot-roulette.pck', 17)), merge(parts('buckshot-roulette.wasm', 3))]);
      const nativeFetch = window.fetch.bind(window);
      window.fetch = (resource, ...args) => {
        const url = typeof resource === 'string' ? resource : resource.url;
        if (url.endsWith('buckshot-roulette.pck')) return nativeFetch(pckUrl, ...args);
        if (url.endsWith('buckshot-roulette.wasm')) return nativeFetch(wasmUrl, ...args);
        return nativeFetch(resource, ...args);
      };
      statusText.textContent = 'starting game'; barFill.style.width = '100%';
      const engine = new Engine({ args: [], canvasResizePolicy: 2, ensureCrossOriginIsolationHeaders: false, executable: 'buckshot-roulette', experimentalVK: false, fileSizes: { 'buckshot-roulette.pck': 344705792, 'buckshot-roulette.wasm': 43444261 }, focusCanvas: true, gdextensionLibs: [] });
      engine.startGame({ onProgress(current, total) { if (total) barFill.style.width = (100 * current / total) + '%'; } }).then(() => { loadingUI.style.display = 'none'; }, fail);
    } catch (error) { fail(error); }
  })();
  </script>
</body>
</html>
