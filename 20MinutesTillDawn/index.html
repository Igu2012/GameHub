<!DOCTYPE html>
<html lang="en-us">
<head>
    <link rel="icon" type="image/png" href="../img/20minutestilldawn.png">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>20 Minutes Till Dawn</title>
    
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000; /* Changed to black for custom loading screen */
            color: #fff;
            font-family: sans-serif;
        }
        #unity-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
        }
        /* Custom loading screen styles */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-content { text-align: center; }
        .loading-text { color: white; font-size: 32px; font-family: sans-serif; margin-bottom: 20px; letter-spacing: 2px; }
        .progress-container { width: 300px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: white; transition: width 0.3s ease; }
    </style>
    <script>
        (function() {
            function enableFullscreen() {
                const docEl = document.documentElement;
                const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
                if (requestFullScreen) {
                    requestFullScreen.call(docEl).catch(e => {});
                }
            }
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                ['touchstart', 'click', 'keydown'].forEach(event => {
                    window.addEventListener(event, enableFullscreen, { once: true });
                });
            }
        })();
    </script>
</head>
<body>
    <!-- Custom loading screen HTML -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loading-text">LOADING... 0%</div>
        <div class="progress-container"><div class="progress-bar"></div></div>
      </div>
    </div>

    <div id="unity-container">
        <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
        <!-- Original loading UI removed or hidden -->
    </div>
    <script>
        let loadedBytes = 0;
        const totalSize = 57.65; // MB

        const loadingScreen = document.querySelector("#loading-screen");
        const loadingText = document.querySelector(".loading-text");
        const progressBar = document.querySelector(".progress-bar");

        function updateCustomProgress(progress) {
            const percentage = Math.round(progress * 100);
            if (loadingText) loadingText.textContent = `LOADING... ${percentage}%`;
            if (progressBar) progressBar.style.width = `${percentage}%`;
        }

        async function fetchWithProgress(url) {
            const response = await fetch(url);
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;
            const contentLength = response.headers.get('Content-Length');
            const total = contentLength ? parseInt(contentLength, 10) : totalSize * 1024 * 1024; // Fallback to estimated totalSize

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                chunks.push(value);
                updateCustomProgress(received / total);
            }
            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }

        async function mergeFiles(fileParts) {
            const buffers = await Promise.all(
                fileParts.map(part => fetchWithProgress(part))
            );
            const mergedBlob = new Blob(buffers);
            return URL.createObjectURL(mergedBlob);
        }

        function getParts(file, count) {
            let parts = [];
            for (let i = 1; i <= count; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        const canvas = document.querySelector("#unity-canvas");

        (async () => {
            const [dataUrl, wasmUrl] = await Promise.all([
                mergeFiles(getParts("Build/20minutes.data", 2)),
                mergeFiles(getParts("Build/20minutes.wasm", 2)),
            ]);
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/20-minutes.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: "Build/20minutes.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "20 Minutes Till Dawn",
                productVersion: "1.0",
            };
            var container = document.querySelector("#unity-container");
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                config.devicePixelRatio = 1;
            } else {
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                }
                resizeCanvas();
                window.addEventListener("resize", resizeCanvas);
            }
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    // Unity's internal progress is not used for custom loading screen
                }).then((unityInstance) => {
                    loadingScreen.style.display = "none"; // Hide custom loading screen
                }).catch((message) => {
                    alert(message);
                });
            };
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
