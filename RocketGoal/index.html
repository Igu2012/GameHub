<script>
    launch();

    function launch() {
        try {
            fetch("https://cdn.jsdelivr.net/gh/martinmmcyt/rocket-goal@main/game.html?t=" + Date.now())
                .then(response => response.text())
                .then(html => {
                    document.documentElement.innerHTML = html;

                    document.documentElement.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                    });
                });
        } catch (error) {
            console.error('error:', error);
        }
    }
</script>

<script>
    (function() {
        function enableFullscreen() {
            const docEl = document.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFullScreen) {
                requestFullScreen.call(docEl).catch(e => {});
            }
        }

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            ['touchstart', 'click', 'keydown'].forEach(event => {
                window.addEventListener(event, enableFullscreen, { once: true });
            });
        }
    })();
</script>
