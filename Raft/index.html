<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Raft</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #111;
            color: #fff;
            font-family: sans-serif;
        }
        #unity-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
        }
        #loading-ui {
            position: absolute;
            text-align: center;
            width: 300px;
            z-index: 10;
        }
        #bar-container {
            width: 100%;
            height: 6px;
            background: #333;
            margin-top: 10px;
            border-radius: 3px;
        }
        #bar-fill {
            width: 0%;
            height: 100%;
            background: #eee;
            border-radius: 3px;
            transition: width 0.1s;
        }
        #status-text {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/genizy/web-port@main/raft/Build/UnityLoader.js"></script>
    <script>
        (function() {
            function enableFullscreen() {
                const docEl = document.documentElement;
                const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
                if (requestFullScreen) {
                    requestFullScreen.call(docEl).catch(e => {});
                }
            }
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                ['touchstart', 'click', 'keydown'].forEach(event => {
                    window.addEventListener(event, enableFullscreen, { once: true });
                });
            }
        })();

        let max = 0;
        let done = 0;
        function mergeFiles(fileParts, statusText) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        resolve(URL.createObjectURL(mergedBlob));
                        return;
                    }
                    fetch("https://cdn.jsdelivr.net/gh/genizy/web-port@main/raft/" + fileParts[index])
                        .then(res => res.arrayBuffer())
                        .then(data => {
                            buffers.push(data);
                            done++;
                            statusText.textContent = `LOADING... (${done}/${max})`;
                            fetchPart(index + 1);
                        })
                        .catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
            max += end;
            return parts;
        }
    </script>
</head>
<body>
    <div id="unity-container">
        <div id="unityContainer" style="width: 100%; height: 100%"></div>
        <div id="loading-ui">
            <div id="status-text">LOADING...</div>
            <div id="bar-container"><div id="bar-fill"></div></div>
        </div>
    </div>
    <script>
        const statusText = document.querySelector("#status-text");
        const barFill = document.querySelector("#bar-fill");
        const loadingUI = document.querySelector("#loading-ui");

        Promise.all([
            mergeFiles(getParts("Build/Raft-WEBGL.data.unityweb", 1, 3), statusText),
            mergeFiles(getParts("Build/Raft-WEBGL.asm.code.unityweb", 1, 2), statusText)
        ]).then(([dataUrl, asmCode]) => {
            var json = {
                "TOTAL_MEMORY": 268435456,
                "dataUrl": dataUrl,
                "asmCodeUrl": asmCode,
                "asmMemoryUrl": "https://cdn.jsdelivr.net/gh/genizy/web-port@main/raft/Build/Raft-WEBGL.asm.memory.unityweb",
                "asmFrameworkUrl": "https://cdn.jsdelivr.net/gh/genizy/web-port@main/raft/Build/Raft-WEBGL.asm.framework.unityweb",
                "splashScreenStyle": "Dark",
                "backgroundColor": "#000000"
            };
            
            UnityLoader.instantiate("unityContainer", json, {
                onProgress: (gameInstance, progress) => {
                    barFill.style.width = (100 * progress) + "%";
                },
                Module: {
                    onRuntimeInitialized: function () {
                        loadingUI.remove();
                    }
                }
            });
        });
    </script>
</body>
</html>
