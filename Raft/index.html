<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Raft</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        #unity-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #unityContainer {
            width: 100%;
            height: 100%;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .loading-box {
            width: 250px;
            text-align: center;
        }
        #status-text {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: width 0.2s;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/genizy/web-port@main/raft/Build/UnityLoader.js"></script>
    <script>
        // Fullscreen Mobile
        (function() {
            function enableFullscreen() {
                const docEl = document.documentElement;
                const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
                if (requestFullScreen) {
                    requestFullScreen.call(docEl).catch(e => console.log(e));
                }
            }
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                ['touchstart', 'click'].forEach(event => {
                    window.addEventListener(event, enableFullscreen, { once: true });
                });
            }
        })();

        // File Merging Logic
        let totalParts = 0;
        let loadedParts = 0;

        function updateProgress() {
            const fill = document.getElementById("progress-fill");
            const status = document.getElementById("status-text");
            if (totalParts > 0) {
                const percent = (loadedParts / totalParts) * 100;
                fill.style.width = percent + "%";
                status.textContent = `LOADING... ${Math.round(percent)}%`;
            }
        }

        function mergeFiles(fileParts) {
            totalParts += fileParts.length;
            return new Promise((resolve, reject) => {
                let buffers = [];
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        resolve(URL.createObjectURL(new Blob(buffers)));
                        return;
                    }
                    fetch("https://cdn.jsdelivr.net/gh/genizy/web-port@main/raft/" + fileParts[index])
                        .then(res => res.arrayBuffer())
                        .then(data => {
                            buffers.push(data);
                            loadedParts++;
                            updateProgress();
                            fetchPart(index + 1);
                        })
                        .catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
            return parts;
        }
    </script>
</head>
<body>
    <div id="unity-container">
        <div id="unityContainer"></div>
        <div id="loading-overlay">
            <div class="loading-box">
                <div id="status-text">LOADING...</div>
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        Promise.all([
            mergeFiles(getParts("Build/Raft-WEBGL.data.unityweb", 1, 3)),
            mergeFiles(getParts("Build/Raft-WEBGL.asm.code.unityweb", 1, 2))
        ]).then(([dataUrl, asmCode]) => {
            var json = {
                "TOTAL_MEMORY": 268435456,
                "dataUrl": dataUrl,
                "asmCodeUrl": asmCode,
                "asmMemoryUrl": "https://cdn.jsdelivr.net/gh/genizy/web-port@main/raft/Build/Raft-WEBGL.asm.memory.unityweb",
                "asmFrameworkUrl": "https://cdn.jsdelivr.net/gh/genizy/web-port@main/raft/Build/Raft-WEBGL.asm.framework.unityweb",
                "splashScreenStyle": "Dark",
                "backgroundColor": "#000000"
            };
            
            UnityLoader.instantiate("unityContainer", json, {
                onProgress: (gameInstance, progress) => {
                    // Progress from Unity after files are merged
                    if (progress === 1) {
                        setTimeout(() => {
                            const overlay = document.getElementById("loading-overlay");
                            if (overlay) overlay.remove();
                        }, 500);
                    }
                }
            });
        });
    </script>
</body>
</html>
