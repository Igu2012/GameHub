<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no, shrink-to-fit=yes">
  <meta name="theme-color" content="#140f1d">
  <meta name="description" content="Play Block Breaker online on GameHub.">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Block Breaker</title>
  <style>
    @font-face { font-family: 'Jersey'; src: url('assets/Jersey10.woff2') format('woff2'); font-display: swap; }
    :root { background: #140f1d; color: #fff; font-family: Jersey, Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; background: #140f1d; }
    body { display: grid; place-items: center; touch-action: none; }
    #game-shell { position: relative; width: min(100vw, 960px); aspect-ratio: 16 / 10; max-height: 100vh; overflow: hidden; background: #201828; box-shadow: 0 16px 60px rgba(0,0,0,.55); }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
    #hud { position: absolute; inset: 0 0 auto; z-index: 2; display: flex; justify-content: space-between; padding: 13px 20px; color: #fff; font-size: clamp(19px, 3vw, 29px); letter-spacing: .06em; text-shadow: 2px 2px 0 #281834; pointer-events: none; }
    #hud span { display: inline-flex; align-items: center; gap: 7px; }
    #start-screen { position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; color: #fff; text-align: center; background: rgba(20, 15, 29, .58); }
    #start-screen[hidden] { display: none; }
    #headline { margin: 0; color: #ffe362; font-size: clamp(46px, 9vw, 88px); letter-spacing: .06em; text-shadow: 4px 4px 0 #9e3d55; }
    #instruction { max-width: 440px; margin: 0; font-family: Arial, sans-serif; font-size: clamp(14px, 2.3vw, 18px); line-height: 1.45; }
    #play-button { padding: 12px 34px; color: #201828; background: #ffe362; border: 3px solid #fff4ab; border-radius: 7px; box-shadow: 0 5px 0 #9e3d55; font: 700 clamp(23px, 4vw, 35px) Jersey, Arial, sans-serif; letter-spacing: .05em; cursor: pointer; }
    #play-button:active { transform: translateY(4px); box-shadow: 0 1px 0 #9e3d55; }
    #credits { position: absolute; right: 12px; bottom: 8px; z-index: 3; color: rgba(255,255,255,.65); font: 11px Arial, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Block Breaker game">
    <canvas id="game" width="960" height="600" aria-label="Block Breaker play area"></canvas>
    <div id="hud"><span id="score">SCORE 000000</span><span id="lives">♥ ♥ ♥</span></div>
    <section id="start-screen" aria-live="polite">
      <h1 id="headline">BLOCK BREAKER</h1>
      <p id="instruction">Move the paddle with your finger, mouse, or arrow keys. Break every block and keep the ball in play.</p>
      <button id="play-button" type="button">PLAY</button>
    </section>
    <div id="credits">Inspired by Google Block Breaker</div>
  </main>

  <script>
    (() => {
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      if (!isMobile) return;
      const enableFullscreen = () => {
        const root = document.documentElement;
        const request = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen || root.msRequestFullscreen;
        if (request && !document.fullscreenElement && !document.webkitFullscreenElement) Promise.resolve(request.call(root)).catch(() => {});
      };
      ['touchstart', 'click', 'keydown'].forEach(eventName => {
        window.addEventListener(eventName, enableFullscreen, { once: true, passive: eventName === 'touchstart' });
      });
    })();

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const screen = document.getElementById('start-screen');
    const headline = document.getElementById('headline');
    const instruction = document.getElementById('instruction');
    const playButton = document.getElementById('play-button');
    const scoreElement = document.getElementById('score');
    const livesElement = document.getElementById('lives');
    const width = canvas.width;
    const height = canvas.height;
    const assets = {};
    const imagePaths = {
      background: 'assets/background_gradient.png', balls: 'assets/balls.png', blocks: 'assets/blocks.png',
      paddle: 'assets/paddle.png', hearts: 'assets/hearts.png', effect: 'assets/effect.png'
    };
    const colors = ['#ef5d58', '#f1ca58', '#53af6e', '#6688e8'];
    let lastFrame = 0;
    let running = false;
    let score = 0;
    let lives = 3;
    let paddle;
    let ball;
    let bricks = [];
    let keyboard = { left: false, right: false };
    let targetPaddleX = null;

    function loadImage(name, src) {
      return new Promise(resolve => {
        const image = new Image();
        image.onload = () => { assets[name] = image; resolve(); };
        image.onerror = () => resolve();
        image.src = src;
      });
    }

    function createBricks() {
      const rows = 7;
      const cols = 11;
      const gap = 6;
      const brickWidth = 72;
      const brickHeight = 27;
      const startX = (width - (cols * brickWidth + (cols - 1) * gap)) / 2;
      const startY = 112;
      bricks = [];
      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          bricks.push({ x: startX + col * (brickWidth + gap), y: startY + row * (brickHeight + gap), width: brickWidth, height: brickHeight, color: Math.floor(row / 2), alive: true });
        }
      }
    }

    function resetBall(stuck = true) {
      ball = { x: paddle.x + paddle.width / 2, y: paddle.y - 13, radius: 10, vx: 290, vy: -340, stuck };
    }

    function resetGame() {
      score = 0;
      lives = 3;
      paddle = { x: width / 2 - 72, y: height - 54, width: 144, height: 18, speed: 610 };
      createBricks();
      resetBall(true);
      updateHUD();
    }

    function updateHUD() {
      scoreElement.textContent = `SCORE ${String(score).padStart(6, '0')}`;
      livesElement.textContent = `♥ ${'♥ '.repeat(Math.max(0, lives - 1)).trim()}`;
    }

    function showScreen(title, message, buttonText) {
      headline.textContent = title;
      instruction.textContent = message;
      playButton.textContent = buttonText;
      screen.hidden = false;
    }

    function startOrResume() {
      if (!running) {
        resetGame();
        running = true;
      }
      screen.hidden = true;
      ball.stuck = false;
      lastFrame = performance.now();
      requestAnimationFrame(loop);
    }

    function pointerX(event) {
      const rect = canvas.getBoundingClientRect();
      return (event.clientX - rect.left) * (width / rect.width);
    }

    function movePointer(event) {
      targetPaddleX = pointerX(event) - paddle.width / 2;
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#372339');
      gradient.addColorStop(.55, '#21192c');
      gradient.addColorStop(1, '#11101a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(255,255,255,.035)';
      for (let x = 0; x < width; x += 40) ctx.fillRect(x, 0, 1, height);
      for (let y = 0; y < height; y += 40) ctx.fillRect(0, y, width, 1);
    }

    function drawBrick(brick) {
      const image = assets.blocks;
      if (image) {
        ctx.drawImage(image, 0, brick.color * 32, 54, 32, brick.x, brick.y, brick.width, brick.height);
      } else {
        ctx.fillStyle = colors[brick.color];
        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
      }
    }

    function drawPaddle() {
      const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
      gradient.addColorStop(0, '#f7f4ff');
      gradient.addColorStop(.48, '#c9b9ff');
      gradient.addColorStop(.5, '#835fe0');
      gradient.addColorStop(1, '#4c3588');
      ctx.fillStyle = gradient;
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.fillStyle = 'rgba(255,255,255,.58)';
      ctx.fillRect(paddle.x + 7, paddle.y + 3, paddle.width - 14, 3);
      ctx.strokeStyle = '#fff4b0';
      ctx.lineWidth = 2;
      ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.save();
      ctx.shadowColor = '#fff6ab';
      ctx.shadowBlur = 18;
      const gradient = ctx.createRadialGradient(ball.x - 3, ball.y - 4, 2, ball.x, ball.y, ball.radius);
      gradient.addColorStop(0, '#fff');
      gradient.addColorStop(.35, '#ffe165');
      gradient.addColorStop(1, '#e44f50');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      drawBackground();
      for (const brick of bricks) if (brick.alive) drawBrick(brick);
      drawPaddle();
      drawBall();
      ctx.fillStyle = 'rgba(255,255,255,.24)';
      ctx.fillRect(0, 72, width, 2);
    }

    function bounceOffPaddle() {
      const relative = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
      const speed = Math.min(660, Math.hypot(ball.vx, ball.vy) * 1.025);
      const angle = relative * Math.PI * .36;
      ball.vx = speed * Math.sin(angle);
      ball.vy = -Math.abs(speed * Math.cos(angle));
    }

    function update(delta) {
      if (keyboard.left) paddle.x -= paddle.speed * delta;
      if (keyboard.right) paddle.x += paddle.speed * delta;
      if (targetPaddleX !== null) paddle.x += (targetPaddleX - paddle.x) * Math.min(1, delta * 15);
      paddle.x = Math.max(0, Math.min(width - paddle.width, paddle.x));
      if (ball.stuck) {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius - 1;
        return;
      }
      ball.x += ball.vx * delta;
      ball.y += ball.vy * delta;
      if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.radius > width) { ball.x = width - ball.radius; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - ball.radius < 73) { ball.y = 73 + ball.radius; ball.vy = Math.abs(ball.vy); }
      if (ball.vy > 0 && ball.y + ball.radius >= paddle.y && ball.y - ball.radius <= paddle.y + paddle.height && ball.x >= paddle.x - ball.radius && ball.x <= paddle.x + paddle.width + ball.radius) {
        ball.y = paddle.y - ball.radius - 1;
        bounceOffPaddle();
      }
      for (const brick of bricks) {
        if (!brick.alive || ball.x + ball.radius < brick.x || ball.x - ball.radius > brick.x + brick.width || ball.y + ball.radius < brick.y || ball.y - ball.radius > brick.y + brick.height) continue;
        brick.alive = false;
        score += 100;
        ball.vy *= -1;
        updateHUD();
        break;
      }
      if (!bricks.some(brick => brick.alive)) {
        running = false;
        showScreen('YOU WIN!', 'Every block is cleared. Ready for another round?', 'PLAY AGAIN');
      } else if (ball.y - ball.radius > height) {
        lives -= 1;
        updateHUD();
        if (lives <= 0) {
          running = false;
          showScreen('GAME OVER', `Final score: ${score}`, 'PLAY AGAIN');
        } else {
          resetBall(true);
          showScreen('READY?', `${lives} ${lives === 1 ? 'life' : 'lives'} left. Tap PLAY to launch the ball.`, 'PLAY');
        }
      }
    }

    function loop(timestamp) {
      if (!running) { draw(); return; }
      const delta = Math.min(.028, (timestamp - lastFrame) / 1000 || 0);
      lastFrame = timestamp;
      update(delta);
      draw();
      if (running) requestAnimationFrame(loop);
    }

    playButton.addEventListener('click', startOrResume);
    canvas.addEventListener('pointerdown', event => { event.preventDefault(); if (paddle) { movePointer(event); if (running && ball.stuck) ball.stuck = false; } });
    canvas.addEventListener('pointermove', event => { if (paddle) movePointer(event); });
    window.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') { keyboard.left = true; event.preventDefault(); }
      if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') { keyboard.right = true; event.preventDefault(); }
      if ((event.key === ' ' || event.key === 'Enter') && screen.hidden === false) startOrResume();
    });
    window.addEventListener('keyup', event => {
      if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') keyboard.left = false;
      if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') keyboard.right = false;
    });

    Promise.all(Object.entries(imagePaths).map(([name, src]) => loadImage(name, src))).then(() => {
      resetGame();
      draw();
    });
  </script>
</body>
</html>
