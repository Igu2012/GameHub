<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Duck Life 3</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; }
  </style>
  
<style>
  #orientation {
    width: 100%; height: 100%; display: none; position: fixed; inset: 0;
    z-index: 2147483647; background-color: #000;
  }
  #orientation p {
    font: 40px Arial, sans-serif; color: #fff; text-align: center; width: 80%;
    position: fixed; top: 50%; margin: 0; transform: translate(15%, -50%);
  }
  @media (max-width: 767px) { #orientation p { font-size: 30px; } }
</style>
  <script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { ...(window.RufflePlayer.config || {}), contextMenu: "off" };
</script>

  <script src="ruffle.js"></script>
  
<script>
(() => {
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (!isMobile) return;
  const enterFullscreen = () => {
    const root = document.documentElement;
    const request = root.requestFullscreen || root.mozRequestFullScreen || root.webkitRequestFullScreen || root.msRequestFullscreen;
    if (request && !document.fullscreenElement && !document.webkitFullscreenElement) {
      Promise.resolve(request.call(root)).catch(() => {});
    }
  };
  const updateOrientation = () => {
    const notice = document.getElementById('orientation');
    if (notice) notice.style.display = window.matchMedia('(orientation: portrait)').matches ? 'block' : 'none';
  };
  ['touchstart', 'click', 'keydown'].forEach((eventName) => window.addEventListener(eventName, enterFullscreen, { once: true }));
  window.addEventListener('orientationchange', updateOrientation);
  window.addEventListener('resize', updateOrientation);
  document.addEventListener('DOMContentLoaded', updateOrientation);
})();
</script>
</head>
<body>
  
<div id="orientation" class="orientation-msg-container" data-orientation="landscape" aria-live="polite">
  <p class="orientation-msg-text">GIRE O DISPOSITIVO</p>
</div>
  <div id="player"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener('load', () => {
      const player = window.RufflePlayer.newest().createPlayer();
      document.getElementById('player').appendChild(player);
      player.style.width = '100%';
      player.style.height = '100%';
      player.load('ducklife3.swf');
    });
  </script>
</body>
</html>
